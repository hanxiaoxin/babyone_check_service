<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Babyone Check</title><link rel="stylesheet" href="./style.css"></head>
<body><header><div><span class="brand">● Babyone Check</span><small>服务与证书监测</small></div><button id="logout" hidden>退出</button></header>
<main><p id="message" role="status" aria-live="polite"></p>
<section id="login"><h1>连接监测服务</h1><p>输入 API Token，或使用带有 ?token= 的页面链接。</p><form id="login-form"><label>API Token<input name="token" type="password" required autocomplete="off"></label><button>连接</button></form></section>
<div id="workspace" hidden><nav><button data-tab="overview">监测总览</button><button data-tab="projects">项目管理</button><button data-tab="settings">通知设置</button></nav>
<section id="overview"><div class="heading"><div><h1>监测总览</h1><p>查看服务可用性与 SSL 证书状态</p></div><button id="refresh">刷新</button></div><div class="filters"><label>项目<select id="project-filter"><option value="">全部项目</option></select></label><label>类型<select id="kind-filter"><option value="">全部类型</option><option value="http">服务可用性</option><option value="ssl">SSL 证书</option></select></label></div><p id="counts"></p><div id="targets" class="grid"></div><div class="pager"><button id="previous">上一页</button><span id="page-label"></span><button id="next">下一页</button></div></section>
<section id="projects" hidden><h1>项目管理</h1><form id="project-form"><label>项目名称<input name="name" required maxlength="100"></label><label>项目描述<textarea name="description" maxlength="2000"></textarea></label><button>创建项目</button></form><div id="project-list" class="grid"></div><h2>添加检测目标</h2><form id="target-form" class="form-grid"><label>项目<select name="project" id="target-project" required></select></label><label>名称<input name="name" required maxlength="100"></label><label>类型<select name="kind"><option value="http">服务可用性</option><option value="ssl">SSL 证书</option></select></label><label>地址<input name="address" placeholder="https://example.com/health" required></label><label>检测间隔（秒）<input name="interval_seconds" type="number" min="10" max="2592000" value="60" required></label><label>超时（秒）<input name="timeout_seconds" type="number" min="1" max="60" value="10" required></label><label id="expected-label">预期 HTTP 状态<input name="expected_status" type="number" min="100" max="599" value="200" required></label><button>添加目标</button></form></section>
<section id="settings" hidden><h1>通知设置</h1><p id="smtp-status"></p><form id="settings-form" class="form-grid"><label>SMTP 服务器<input name="host" placeholder="smtp.example.com" required></label><label>端口<input name="port" type="number" min="1" max="65535" value="587" required></label><label>加密方式<select name="tls_mode"><option value="starttls">STARTTLS（通常 587）</option><option value="tls">TLS（通常 465）</option></select></label><label>用户名<input name="username" autocomplete="off"></label><label>密码 / 授权码<input name="password" type="password" autocomplete="new-password" placeholder="留空保留已保存密码"><small id="smtp-password-status"></small></label><label class="check"><input name="clear_password" type="checkbox">清除已保存密码</label><label>发件人邮箱<input name="from" type="email" required></label><label>收件人邮箱<input name="to" placeholder="a@example.com, b@example.com" required></label><label>证书到期提前通知（天）<input name="ssl_warning_days" type="number" min="1" max="365" value="1" required></label><label class="check"><input name="auto_notify" type="checkbox">自动邮件通知</label><p>保存后立即生效。故障、恢复与证书即将到期时发送邮件。</p><button>保存设置</button></form></section>
</div></main><dialog id="history"><div class="heading"><h2 id="history-title">检测历史</h2><button id="close-history">关闭</button></div><label>时间范围<select id="history-range"><option value="86400">最近 24 小时</option><option value="604800">最近 7 天</option><option value="2592000">最近 30 天</option></select></label><p id="stats"></p><div class="table-scroll"><table><thead><tr><th>时间</th><th>结果</th><th>延迟</th><th>HTTP</th><th>证书到期</th><th>错误</th></tr></thead><tbody id="history-rows"></tbody></table></div><button id="more-history">加载更多</button></dialog><script type="module" src="./app.js"></script></body></html>
